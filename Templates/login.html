<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pictor – Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Caveat:wght@400;500;600;700&family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    /* Light Theme (Default) */
    :root {
      --bg-gradient-start: #fdfbf7;
      --bg-gradient-end: #f0ebe2;
      --warm:    #f2ece1;
      --ink:     #1a1614;
      --muted:   #7a6f68;
      --accent:  #e05c3a;
      --creator: #e05c3a;
      --consumer: #6b7fd4;
      --border:  #e4ddd5;
      --white:   #ffffff;
      --error:   #d94040;
      --success: #2a7a3b;
      --r:       14px;
      --shadow:  0 8px 32px rgba(0,0,0,.08);
      --card-bg: rgba(255,255,255,0.9);
      --input-bg: #faf7f2;
      --transition: all 0.3s ease;
      --blob-opacity: 0.2;
    }

    /* Dark Theme */
    [data-theme="dark"] {
      --bg-gradient-start: #0f0f1a;
      --bg-gradient-end: #1a1a2e;
      --warm:    #16213e;
      --ink:     #eeeeee;
      --muted:   #a0a0a0;
      --accent:  #e05c3a;
      --creator: #e05c3a;
      --consumer: #6b7fd4;
      --border:  #2a2a4a;
      --white:   #0f0f1a;
      --error:   #ff6b6b;
      --success: #6bdf6b;
      --shadow:  0 8px 32px rgba(0,0,0,.3);
      --card-bg: rgba(22,33,62,0.95);
      --input-bg: #1a1a2e;
      --blob-opacity: 0.15;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Caveat', 'Amatic SC', cursive;
      background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      transition: var(--transition);
      position: relative;
      font-size: 1.1rem;
    }

    /* Animated gradient background */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(circle at 20% 80%, rgba(224,92,58,0.08) 0%, transparent 50%),
                  radial-gradient(circle at 80% 20%, rgba(107,127,212,0.08) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    /* Theme Toggle Button - MOVED LEFT */
    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 80px;
      z-index: 1000;
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 40px;
      padding: 10px;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: var(--transition);
    }

    .theme-toggle:hover {
      transform: scale(1.05);
    }

    .theme-toggle svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: var(--ink);
      stroke-width: 2;
    }

    /* Decorative background blobs */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      opacity: var(--blob-opacity);
      pointer-events: none;
      z-index: 0;
      transition: var(--transition);
    }
    .blob-1 {
      width: 500px;
      height: 500px;
      background: var(--accent);
      top: -200px;
      right: -150px;
    }
    .blob-2 {
      width: 450px;
      height: 450px;
      background: var(--consumer);
      bottom: -150px;
      left: -120px;
    }
    .blob-3 {
      width: 300px;
      height: 300px;
      background: #e05c3a;
      top: 40%;
      left: -100px;
      opacity: 0.1;
    }

    .card {
      position: relative;
      z-index: 10;
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 440px;
      padding: 44px 40px 40px;
      animation: fadeUp 0.6s cubic-bezier(0.2, 0.9, 0.4, 1.1) both;
      transition: var(--transition);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo a {
      font-family: 'Caveat', 'Amatic SC', cursive;
      font-size: 3rem;
      font-weight: 700;
      color: var(--ink);
      text-decoration: none;
      transition: var(--transition);
      display: inline-block;
      cursor: pointer;
    }
    .logo a:hover {
      transform: scale(1.02);
    }
    .logo a span { 
      background: linear-gradient(135deg, var(--accent), var(--consumer));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .role-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      background: var(--warm);
      border-radius: 16px;
      padding: 6px;
      margin-bottom: 32px;
      transition: var(--transition);
    }

    .role-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-family: 'Caveat', 'Amatic SC', cursive;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--muted);
      background: transparent;
      transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    }
    .role-btn svg { width: 18px; height: 18px; flex-shrink: 0; }

    .role-btn.active-consumer {
      background: var(--white);
      color: var(--consumer);
      box-shadow: 0 4px 12px rgba(107,127,212,.2);
    }
    .role-btn.active-creator {
      background: var(--white);
      color: var(--creator);
      box-shadow: 0 4px 12px rgba(224,92,58,.2);
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: .02em;
      margin-bottom: 8px;
      font-family: 'Caveat', 'Amatic SC', cursive;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrap svg {
      position: absolute;
      left: 16px;
      width: 18px;
      height: 18px;
      color: var(--muted);
      pointer-events: none;
      transition: var(--transition);
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 14px 16px 14px 48px;
      border: 1.5px solid var(--border);
      border-radius: 16px;
      background: var(--input-bg);
      font-family: 'Caveat', 'Amatic SC', cursive;
      font-size: 1rem;
      color: var(--ink);
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(224,92,58,.15);
      background: var(--card-bg);
    }

    .consumer-mode input:focus {
      border-color: var(--consumer);
      box-shadow: 0 0 0 3px rgba(107,127,212,.15);
    }

    input::placeholder { color: #b0a89e; opacity: 0.5; font-family: 'Caveat', cursive; }

    .eye-btn {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      padding: 6px;
      display: flex;
      align-items: center;
      transition: var(--transition);
      border-radius: 8px;
    }
    .eye-btn svg { width: 18px; height: 18px; }
    .eye-btn:hover { color: var(--ink); background: var(--warm); }

    .submit-btn {
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      border: none;
      cursor: pointer;
      font-family: 'Caveat', 'Amatic SC', cursive;
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--white);
      background: linear-gradient(135deg, var(--accent), #c94e31);
      transition: all 0.25s ease;
      letter-spacing: .01em;
      margin-top: 8px;
    }
    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(224,92,58,.35);
    }
    .submit-btn:active { transform: scale(.98); }
    .submit-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .submit-btn.consumer-style {
      background: linear-gradient(135deg, var(--consumer), #5a6bbf);
    }
    .submit-btn.consumer-style:hover {
      box-shadow: 0 8px 24px rgba(107,127,212,.35);
    }

    .card-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.95rem;
      color: var(--muted);
      line-height: 1.7;
      font-family: 'Caveat', 'Amatic SC', cursive;
    }
    .card-footer a {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
      transition: var(--transition);
    }
    .card-footer a:hover { text-decoration: underline; }

    .consumer-mode .card-footer a { color: var(--consumer); }

    .alert {
      padding: 14px 16px;
      border-radius: 16px;
      margin-bottom: 24px;
      display: none;
      font-size: 0.95rem;
      text-align: center;
      animation: slideIn 0.3s ease;
      font-weight: 500;
      font-family: 'Caveat', 'Amatic SC', cursive;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .alert-error {
      background: rgba(217, 64, 64, 0.1);
      color: var(--error);
      border: 1px solid rgba(217, 64, 64, 0.3);
    }
    .alert-success {
      background: rgba(42, 122, 59, 0.1);
      color: var(--success);
      border: 1px solid rgba(42, 122, 59, 0.3);
    }
    .alert-info {
      background: rgba(12, 84, 96, 0.1);
      color: #0c5460;
      border: 1px solid rgba(12, 84, 96, 0.3);
    }
  </style>
</head>
<body>

  
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark/light mode">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
    </svg>
  </button>

  <div class="card" id="loginCard">

    <div class="logo">
      <a href="#" onclick="window.location.reload(); return false;">Pict<span>o</span>r</a>
    </div>

    <div class="role-toggle">
      <button class="role-btn active-consumer" id="btnConsumer" onclick="setRole('consumer')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        Consumer
      </button>
      <button class="role-btn" id="btnCreator" onclick="setRole('creator')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        Creator
      </button>
    </div>

    <div id="loginForm">
      <div id="alert" class="alert"></div>

      <div class="form-group">
        <label for="email">Email</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" />
          <button class="eye-btn" type="button" id="togglePassword" title="Show/hide password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <button class="submit-btn" id="submitBtn" type="button">
        Log in as Consumer
      </button>
    </div>

    <div class="card-footer">
      <div>New here? <a href="consumer_registration.html">Create a consumer account</a></div>
      <div style="margin-top: 8px;">Want to become a creator? <a href="creator_registration.html" style="color: var(--creator);">Apply as Creator</a></div>
    </div>

  </div>

  <script>
    // ============================================
    // AZURE BACKEND URL
    // ============================================
    const API_BASE_URL = "";
    
    // ============================================
    // DARK/LIGHT MODE FUNCTIONALITY
    // ============================================
    
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    
    function updateThemeIcon() {
      const theme = document.documentElement.getAttribute('data-theme');
      const toggleBtn = document.getElementById('themeToggle');
      if (toggleBtn) {
        if (theme === 'dark') {
          toggleBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>`;
        } else {
          toggleBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>`;
        }
      }
    }
    
    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      updateThemeIcon();
    }
    
    document.getElementById('themeToggle').addEventListener('click', toggleTheme);
    updateThemeIcon();
    
    // ============================================
    // LOGIN FUNCTIONALITY
    // ============================================
    
    let currentRole = 'consumer';

    function setRole(role) {
      currentRole = role;
      const card       = document.getElementById('loginCard');
      const btnC       = document.getElementById('btnConsumer');
      const btnCr      = document.getElementById('btnCreator');
      const submitBtn  = document.getElementById('submitBtn');

      if (role === 'creator') {
        card.classList.remove('consumer-mode');
        btnCr.classList.add('active-creator');
        btnCr.classList.remove('active-consumer');
        btnC.classList.remove('active-consumer', 'active-creator');
        submitBtn.classList.remove('consumer-style');
        submitBtn.textContent = 'Log in as Creator';
      } else {
        card.classList.add('consumer-mode');
        btnC.classList.add('active-consumer');
        btnC.classList.remove('active-creator');
        btnCr.classList.remove('active-creator', 'active-consumer');
        submitBtn.classList.add('consumer-style');
        submitBtn.textContent = 'Log in as Consumer';
      }
    }

    const toggleBtn = document.getElementById('togglePassword');
    if (toggleBtn) {
      toggleBtn.addEventListener('click', function() {
        const passwordInput = document.getElementById('password');
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
      });
    }

    function showAlert(message, type) {
      const alertDiv = document.getElementById('alert');
      alertDiv.className = `alert alert-${type}`;
      alertDiv.textContent = message;
      alertDiv.style.display = 'block';
      
      setTimeout(() => {
        alertDiv.style.display = 'none';
      }, 4000);
    }

    document.getElementById('submitBtn').addEventListener('click', async function() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      if (!email || !password) {
        showAlert('Please enter both email and password', 'error');
        return;
      }
      
      const submitBtn = document.getElementById('submitBtn');
      const originalText = submitBtn.textContent;
      submitBtn.textContent = 'Logging in...';
      submitBtn.disabled = true;
      
      try {
        const response = await fetch(`${API_BASE_URL}/api/login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            email: email,
            password: password,
            role: currentRole
          })
        });
        
        const data = await response.json();
        
        if (data.success) {
          localStorage.setItem('jwt_token', data.token);
          localStorage.setItem('currentUser', JSON.stringify(data.user));
          
          showAlert(data.message, 'success');
          
          setTimeout(() => {
            if (data.user.role === 'creator') {
              window.location.href = 'creator.html';
            } else {
              window.location.href = 'consumer.html';
            }
          }, 1000);
        } else {
          showAlert(data.message || 'Login failed', 'error');
        }
      } catch (error) {
        console.error('Login error:', error);
        showAlert('Cannot connect to server. Make sure Flask is running on ' + API_BASE_URL, 'error');
      } finally {
        submitBtn.textContent = originalText;
        submitBtn.disabled = false;
      }
    });

    document.getElementById('password').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        document.getElementById('submitBtn').click();
      }
    });
    
    document.getElementById('email').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        document.getElementById('submitBtn').click();
      }
    });

    setRole('consumer');
  </script>
</body>
</html>
